# Greensound — Apache virtual host, simplest variant
#
# Apache forwards *everything* to the Node process, which serves the site, the
# API and the uploads itself. Use this if you would rather keep one moving
# part; it costs a little performance on static files.
#
# Enable:
#   sudo a2enmod proxy proxy_http headers ssl
#   sudo a2ensite greensound
#   sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName greensoundproject.com
    RedirectPermanent / https://greensoundproject.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName greensoundproject.com

    SSLEngine on
    # SSLCertificateFile    /etc/letsencrypt/live/greensoundproject.com/fullchain.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/greensoundproject.com/privkey.pem

    ErrorLog  ${APACHE_LOG_DIR}/greensound-error.log
    CustomLog ${APACHE_LOG_DIR}/greensound-access.log combined

    ProxyPreserveHost On
    ProxyTimeout 60
    ProxyPass        / http://127.0.0.1:3001/
    ProxyPassReverse / http://127.0.0.1:3001/

    # Without these Node sees every request as plain HTTP from 127.0.0.1,
    # which breaks the login rate-limiter.
    RequestHeader set X-Forwarded-Proto "https"

    LimitRequestBody 12582912

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    </IfModule>
</VirtualHost>
