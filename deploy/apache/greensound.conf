# Greensound — Apache virtual host
#
# Apache serves the built static site directly (it is very good at that) and
# forwards only /api and /uploads to the Node process. Nothing else needs to
# reach Node, so a page view costs no Node CPU at all.
#
# Enable the required modules first:
#   sudo a2enmod proxy proxy_http headers rewrite expires ssl
#   sudo a2ensite greensound
#   sudo systemctl reload apache2
#
# For HTTPS, the simplest route is certbot, which rewrites this file for you:
#   sudo certbot --apache -d greensoundproject.com -d www.greensoundproject.com

<VirtualHost *:80>
    ServerName greensoundproject.com
    ServerAlias www.greensoundproject.com

    # Everything goes to HTTPS. certbot adds this for you; kept here so the
    # file is correct even without it.
    RedirectPermanent / https://greensoundproject.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName greensoundproject.com
    ServerAlias www.greensoundproject.com

    SSLEngine on
    # certbot fills these in:
    # SSLCertificateFile    /etc/letsencrypt/live/greensoundproject.com/fullchain.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/greensoundproject.com/privkey.pem

    DocumentRoot /var/www/greensound/dist

    ErrorLog  ${APACHE_LOG_DIR}/greensound-error.log
    CustomLog ${APACHE_LOG_DIR}/greensound-access.log combined

    # ---------------------------------------------------------------------
    #  API and uploads -> Node
    # ---------------------------------------------------------------------
    # These must come before the DocumentRoot rules: ProxyPass wins over the
    # filesystem, so /api never falls through to index.html.
    ProxyPreserveHost On
    ProxyTimeout 60

    ProxyPass        /api     http://127.0.0.1:3001/api
    ProxyPassReverse /api     http://127.0.0.1:3001/api
    ProxyPass        /uploads http://127.0.0.1:3001/uploads
    ProxyPassReverse /uploads http://127.0.0.1:3001/uploads

    # Node needs to know the original request was HTTPS and who sent it —
    # the login rate-limiter keys on the real client IP, which without this
    # would always be 127.0.0.1.
    RequestHeader set X-Forwarded-Proto "https"

    # Uploads are capped at 10 MB by the API; leave Apache a little headroom
    # so oversized files are rejected by the app with a clear message rather
    # than by the web server with a bare 413.
    LimitRequestBody 12582912

    # ---------------------------------------------------------------------
    #  Static site
    # ---------------------------------------------------------------------
    <Directory /var/www/greensound/dist>
        Require all granted
        Options -Indexes +FollowSymLinks
        AllowOverride None

        # Client-side routing: /Events, /AdminNews and friends are not files
        # on disk. Anything that does not resolve is handed to the app.
        FallbackResource /index.html
    </Directory>

    <IfModule mod_expires.c>
        ExpiresActive On

        # Build output is content-hashed, so it can be cached forever.
        <LocationMatch "^/assets/">
            ExpiresDefault "access plus 1 year"
            Header set Cache-Control "public, immutable"
        </LocationMatch>

        # index.html must never be cached, or visitors keep loading an old
        # build that references assets which no longer exist.
        <LocationMatch "^/(index\.html)?$">
            ExpiresDefault "access plus 0 seconds"
            Header set Cache-Control "no-cache, must-revalidate"
        </LocationMatch>
    </IfModule>

    # ---------------------------------------------------------------------
    #  Security headers
    # ---------------------------------------------------------------------
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
        # The site loads its own assets plus Google Fonts, and nothing else.
        Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; media-src 'self'; frame-ancestors 'self'"
    </IfModule>
</VirtualHost>
